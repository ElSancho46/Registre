  --noir:#050505;--verre:rgba(17,16,14,.78);--verre-fort:rgba(10,10,9,.88);--ligne:rgba(212,174,102,.22);--ligne-forte:#8C6F37;
  --fg:#F4F2EC;--muted:#A8A295;--or:#D4AE66;--or-clair:#F7E6BB;--sur-or:#141007;--vert:#58CF95;--vert-fond:rgba(63,191,127,.14);--danger:#F08A92;
  --metal:linear-gradient(115deg,#9a7636 0%,#e9cf94 22%,#c9a057 40%,#f7e6bb 58%,#b8904a 78%,#e6c98a 100%);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-marque:"Syncopate","Archivo",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--noir);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--noir)}
.fond{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--noir) var(--marbre) 30% 50%/cover}
.fond::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%,rgba(6,6,6,.3),rgba(6,6,6,.68))}
.fond::after{content:"";position:absolute;inset:0;-webkit-mask:var(--veines) 30% 50%/cover no-repeat;mask:var(--veines) 30% 50%/cover no-repeat;background:linear-gradient(105deg,transparent 38%,rgba(255,238,196,.9) 50%,transparent 62%) 0 0/300% 100% no-repeat;animation:eclat 9s ease-in-out infinite}
@keyframes eclat{0%{background-position:0 0}55%,100%{background-position:100% 0}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 1rem/1.25 var(--f-marque);letter-spacing:.14em;margin:0;text-transform:uppercase;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font:600 .95rem var(--f-display);color:var(--or-clair);font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--verre-fort);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ligne);border-radius:14px;padding:4px;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5}
nav button{font:700 .84rem var(--f-display);font-stretch:112%;text-transform:uppercase;letter-spacing:.05em;border:0;background:transparent;color:var(--muted);padding:11px 2px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--metal);color:var(--sur-or)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px}
.label{font:700 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
/* Plaque d'immatriculation */
.plate{display:flex;align-items:stretch;background:rgba(5,5,5,.86);border:1.5px solid var(--or);border-radius:14px;overflow:hidden;min-height:80px;box-shadow:0 14px 34px -18px #000}
.plate .band{background:var(--metal);color:var(--sur-or);width:46px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9px;gap:4px}
.plate .band svg{width:22px;height:22px}
.plate .band b{font:800 1.15rem var(--f-display)}
.field .plate input{appearance:none;-webkit-appearance:none;border-radius:0;width:auto;flex:1;min-width:0;border:0;background:transparent;color:var(--or-clair);font:800 clamp(1.9rem,9vw,2.8rem) var(--f-display);font-stretch:112%;letter-spacing:.05em;text-align:center;text-transform:uppercase;padding:0 8px}
.field .plate input::placeholder{color:rgba(212,174,102,.3)}
.plate input:focus-visible{outline:none}
.plate:focus-within{box-shadow:0 0 0 3px rgba(212,174,102,.28)}
.card{background:var(--verre);border:1px solid var(--ligne);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;flex-direction:column;gap:3px}
.who .name{font:800 1.45rem/1.12 var(--f-display);font-stretch:112%;text-transform:uppercase;overflow-wrap:anywhere}
.who .co{font-size:1.02rem;color:var(--muted)}
.pill{align-self:flex-start;font:600 .82rem var(--f-body);padding:4px 11px;border-radius:99px}
.pill.in{background:var(--vert-fond);color:var(--vert)}
.pill.off{background:rgba(5,5,5,.5);color:var(--muted);border:1px solid var(--ligne)}
.big{font:800 1.2rem var(--f-display);font-stretch:112%;text-transform:uppercase;letter-spacing:.08em;border:0;border-radius:14px;padding:17px;cursor:pointer;width:100%}
.big.arr{background:var(--metal);color:var(--sur-or);box-shadow:inset 0 1px 0 rgba(255,248,226,.55)}
.big.dep{background:rgba(5,5,5,.72);color:var(--or-clair);box-shadow:inset 0 0 0 1.5px var(--or)}
.big:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field textarea,.search{font:500 16px var(--f-body);color:var(--fg);background:rgba(6,6,6,.78);border:1px solid var(--ligne);border-radius:12px;padding:12px;width:100%;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus,.search:focus{border-color:var(--or);outline:none}
::placeholder{color:#7d786d}
.btn{font:600 .92rem var(--f-body);border:1px solid var(--ligne-forte);background:rgba(5,5,5,.6);color:var(--or-clair);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--metal);border-color:transparent;color:var(--sur-or)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:7px 11px;font-size:.86rem}
.sugg{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.sugg button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--verre);border:1px solid var(--ligne);border-radius:12px;padding:11px 12px;cursor:pointer;color:var(--fg);font:inherit}
.pl{font:800 1rem var(--f-display);letter-spacing:.04em;white-space:nowrap;color:var(--or-clair)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font:800 1.1rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--or)}
.list{display:flex;flex-direction:column;border:1px solid var(--ligne);border-radius:18px;background:var(--verre);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--ligne)}
.item:first-child{border-top:0}
.item .t{font:800 1.12rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--or)}
.item .m{min-width:0}
.item .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{color:var(--muted);font-size:.88rem}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.tablewrap{overflow-x:auto;border:1px solid var(--ligne);border-radius:18px;background:var(--verre)}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 12px;border-top:1px solid var(--ligne);white-space:nowrap}
th{font:700 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);border-top:0;background:rgba(5,5,5,.5)}
td.h{font:800 1.02rem var(--f-display)}
td.h .out{color:var(--fg)} td.h .in{color:var(--or)}
.temps span.in,.temps span.out{display:block}
.fiches{display:flex;flex-direction:column;gap:10px}
.fiches .empty{background:var(--verre);border:1px solid var(--ligne);border-radius:14px}
.fiche{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--verre);border:1px solid var(--ligne);border-radius:14px;overflow:hidden}
.fiche .temps{display:flex;flex-direction:column;gap:3px;padding:13px 14px;min-width:104px;border-right:1px solid var(--ligne)}
.fiche .heure{font:800 1.3rem/1.15 var(--f-display);font-variant-numeric:tabular-nums;color:var(--or)}
.fiche .heure.dep{color:var(--fg)}
.fiche .temps .label+.heure+.label{margin-top:8px}
.fiche .duree{font-size:.78rem;color:var(--muted)}
.fiche .depart{align-self:flex-start;margin-top:2px}
.fiche .infos{display:flex;flex-direction:column;gap:7px;padding:13px 14px;min-width:0}
.fiche .infos .pl{font-size:1.25rem;white-space:normal;overflow-wrap:anywhere}
.fiche .ligne{display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.fiche .ligne b{font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=date]{font:600 16px var(--f-body);padding:10px;min-height:46px;border:1px solid var(--ligne);border-radius:12px;background:rgba(6,6,6,.78);color:var(--fg);-webkit-appearance:none;appearance:none}
.tools .search{flex:1 1 180px;width:auto}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.stats b{color:var(--or);font-family:var(--f-display);font-size:1.15rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(20,19,17,.97);color:var(--fg);border:1px solid rgba(212,174,102,.5);padding:12px 18px;border-radius:12px;font-weight:600;width:max-content;max-width:calc(100% - 32px);z-index:20}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.notice{background:var(--verre-fort);color:var(--fg);border:1px solid var(--danger);border-radius:12px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600;color:var(--or-clair)}
@media (prefers-reduced-motion: reduce){*,*::after{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="fond" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1>Registre de filtrage</h1>
    <div class="clock" id="clock">--:--</div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-filtrage" aria-selected="true" data-tab="filtrage">Filtrage</button>
    <button role="tab" id="tab-historique" aria-selected="false" data-tab="historique">Historique</button>
    <button role="tab" id="tab-personnes" aria-selected="false" data-tab="personnes">Personnes</button>
  </nav>

  <div class="notice" id="offline" hidden>Enregistrement indisponible sur cet affichage.</div>

  <!-- FILTRAGE -->
  <section class="panel" id="p-filtrage">
    <div class="field">
      <label class="label" for="plateInput">Plaque d'immatriculation</label>
      <div class="plate">
        <div class="band" aria-hidden="true">
          <svg viewBox="0 0 24 24"><g fill="#141007">
            <circle cx="12" cy="3.5" r="1.1"/><circle cx="16.25" cy="4.64" r="1.1"/><circle cx="19.36" cy="7.75" r="1.1"/><circle cx="20.5" cy="12" r="1.1"/><circle cx="19.36" cy="16.25" r="1.1"/><circle cx="16.25" cy="19.36" r="1.1"/><circle cx="12" cy="20.5" r="1.1"/><circle cx="7.75" cy="19.36" r="1.1"/><circle cx="4.64" cy="16.25" r="1.1"/><circle cx="3.5" cy="12" r="1.1"/><circle cx="4.64" cy="7.75" r="1.1"/><circle cx="7.75" cy="4.64" r="1.1"/></g></svg>
          <b>F</b>
        </div>
        <input id="plateInput" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AB-123-CD" maxlength="14">
      </div>
    </div>

    <div id="result"></div>

    <div class="sectionhead">
      <span class="label">Sur site en ce moment</span>
      <span class="count" id="onsiteCount">0</span>
    </div>
    <div class="fiches" id="onsiteList"><div class="empty">Chargement…</div></div>
  </section>

  <!-- HISTORIQUE -->
  <section class="panel" id="p-historique" hidden>
    <div class="tools">
      <input type="date" id="histDate" aria-label="Jour">
      <input class="search" id="histSearch" placeholder="Rechercher" aria-label="Filtrer l'historique">
      <button class="btn" id="exportBtn" hidden>Exporter (CSV)</button>
    </div>
    <div class="stats" id="histStats"></div>
    <div class="fiches" id="histBody"><div class="empty">Chargement…</div></div>
  </section>

  <!-- PERSONNES -->
  <section class="panel" id="p-personnes" hidden>
    <div class="tools">
      <input class="search" id="persSearch" placeholder="Rechercher" aria-label="Rechercher">
      <span class="count" id="persCount"></span>
    </div>
    <details class="card" id="importBox">
      <summary>Importer une liste</summary>
      
      <div class="field"><textarea id="importText" rows="6" placeholder="Plaque ; Nom ; Prénom ; Société"></textarea></div>
      <div class="row" style="flex:0"><button class="btn primary" id="importBtn" style="flex:0 0 auto">Importer</button></div>
    </details>
    <div class="list" id="persList"><div class="empty">Chargement…</div></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Données enregistrées uniquement sur ce téléphone */
(function(){
  const CLE="registre-filtrage-v2";
  let etat={personnes:{},passages:{}};
  try{const s=JSON.parse(localStorage.getItem(CLE));if(s&&s.personnes&&s.passages)etat=s;}catch(e){}
  const ecoutes=[];
  function sauver(){
    try{localStorage.setItem(CLE,JSON.stringify(etat));}
    catch(e){const err=new Error("plein");err.code="quota_exceeded";throw err;}
    ecoutes.forEach(f=>f());
  }
  function requete(nom,o){
    function lignes(){
      let a=Object.entries(etat[nom]);
      if(o.f)a=a.filter(([,d])=>d[o.f]===o.v);
      if(o.tri)a.sort((x,y)=>{const r=x[1][o.tri]<y[1][o.tri]?-1:x[1][o.tri]>y[1][o.tri]?1:0;return o.sens==="desc"?-r:r;});
      if(o.max)a=a.slice(0,o.max);
      return {docs:a.map(([id,d])=>({id,data:()=>({...d})}))};
    }
    return {
      where:(f,_,v)=>requete(nom,{...o,f,v}),
      orderBy:(tri,sens)=>requete(nom,{...o,tri,sens}),
      limit:max=>requete(nom,{...o,max}),
      get:async()=>lignes(),
      onSnapshot(cb){const f=()=>cb(lignes());ecoutes.push(f);f();return()=>ecoutes.splice(ecoutes.indexOf(f),1);}
    };
  }
  const db={collection:nom=>({
    ...requete(nom,{}),
    doc:id=>({
      set:async d=>{etat[nom][id]=d;sauver();},
      update:async d=>{etat[nom][id]={...etat[nom][id],...d};sauver();},
      delete:async()=>{delete etat[nom][id];sauver();}
    }),
    add:async d=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);etat[nom][id]=d;sauver();return{id};}
  })};
  const downloads={save:async({filename,data})=>{
    const file=new File([data],filename,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});}catch(e){if(e.name!=="AbortError")throw e;}
      return;
    }
    const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }};
  window.claude={use:async n=>n==="db"?db:n==="downloads"?downloads:null};
})();
</script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const key = p => String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const fmtPlate = k => /^[A-Z]{2}\d{3}[A-Z]{2}$/.test(k) ? k.slice(0,2)+"-"+k.slice(2,5)+"-"+k.slice(5) : k;
  const pad = n => String(n).padStart(2,"0");
  const dayOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const hm = iso => { if(!iso) return ""; const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  const dur = (a,b) => { const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000)); return m<60? m+" min" : Math.floor(m/60)+" h "+pad(m%60); };
  const fullName = p => [String(p.nom||"").toUpperCase(), p.prenom||""].filter(Boolean).join(" ");

  let db = null, downloads = null;
  let persons = new Map();     // key -> {plaque,nom,prenom,societe}
  let recent = [];             // passages récents [{id,...}]
  let onsite = new Map();      // key -> passage
  let busy = false;
  let pendingDelete = null;

  // Horloge
  function tick(){ const d=new Date(); $("#clock").textContent = d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})+" · "+pad(d.getHours())+":"+pad(d.getMinutes()); }
  tick(); setInterval(tick, 15000);

  // Onglets
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
  function showTab(t){
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===t ? "true":"false"));
    ["filtrage","historique","personnes"].forEach(n => $("#p-"+n).hidden = n!==t);
    try{ localStorage.setItem("tab", t); }catch(e){}
    if(t==="historique") loadHistory();
    if(t==="filtrage") $("#plateInput").focus();
  }

  let toastT;
  function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true, 2600); }
  function fail(e){ const c=e&&e.code; toast(c==="quota_exceeded" ? "Base pleine : exporte puis supprime d'anciens passages." : c==="invalid_argument" ? "Tu n'as pas le droit d'écrire ici." : "Échec de l'enregistrement, réessaie."); }

  // ---------- FILTRAGE ----------
  const plateInput = $("#plateInput");
  plateInput.addEventListener("input", () => {
    const k = key(plateInput.value);
    const f = fmtPlate(k);
    if(f !== plateInput.value.toUpperCase() && /^[A-Z]{2}\d{3}[A-Z]{2}$/.test(k)) plateInput.value = f;
    renderResult();
  });
  plateInput.addEventListener("keydown", e => {
    if(e.key==="Enter"){ const b = $("#result .big"); if(b) b.click(); }
  });

  function renderResult(){
    const k = key(plateInput.value);
    const box = $("#result");
    if(!k){ box.innerHTML = ""; return; }
    const p = persons.get(k);
    if(p){
      const on = onsite.get(k);
      box.innerHTML = `<div class="card">
        <div class="who"><span class="pl">${esc(fmtPlate(k))}</span><span class="name">${esc(fullName(p))}</span><span class="co">${esc(p.societe||"Société non renseignée")}</span></div>
        ${on ? `<span class="pill in">Sur site depuis ${hm(on.arrivee)}</span>` : `<span class="pill off">Pas sur site</span>`}
        ${on ? `<button class="big dep" id="actBtn">Départ</button>` : `<button class="big arr" id="actBtn">Arrivée</button>`}
      </div>`;
      $("#actBtn").addEventListener("click", () => on ? markDeparture(on) : markArrival(k, p));
      return;
    }
    // suggestions partielles
    const sugg = [...persons.entries()].filter(([pk]) => pk.includes(k)).slice(0,5);
    const suggHtml = sugg.length ? `<div class="sugg"><span class="label">Plaques proches</span>${sugg.map(([pk,pp]) =>
      `<button data-k="${esc(pk)}"><span class="pl">${esc(fmtPlate(pk))}</span><span>${esc(fullName(pp))}</span></button>`).join("")}</div>` : "";
    const form = k.length >= 4 ? `<div class="card">
        <div class="who"><span class="label">Nouvelle personne</span><span class="pl">${esc(fmtPlate(k))}</span></div>
        <div class="row">
          <div class="field"><label class="label" for="nNom">Nom</label><input id="nNom" autocomplete="off" autocapitalize="characters"></div>
          <div class="field"><label class="label" for="nPrenom">Prénom</label><input id="nPrenom" autocomplete="off" autocapitalize="words"></div>
        </div>
        <div class="field"><label class="label" for="nSoc">Société</label><input id="nSoc" autocomplete="off" list="socList"></div>
        <datalist id="socList">${[...new Set([...persons.values()].map(x=>x.societe).filter(Boolean))].sort().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
        <button class="big arr" id="newBtn">Enregistrer et Arrivée</button>
      </div>` : "";
    box.innerHTML = suggHtml + form;
    box.querySelectorAll(".sugg button").forEach(b => b.addEventListener("click", () => { plateInput.value = fmtPlate(b.dataset.k); renderResult(); }));
    const nb = $("#newBtn");
    if(nb) nb.addEventListener("click", async () => {
      const nom = $("#nNom").value.trim(), prenom = $("#nPrenom").value.trim(), societe = $("#nSoc").value.trim();
      if(!nom){ toast("Indique au moins le nom."); $("#nNom").focus(); return; }
      const p = { plaque: fmtPlate(k), nom: nom.toUpperCase(), prenom, societe, cree: new Date().toISOString() };
      if(!db){ toast("Enregistrement indisponible."); return; }
      busy = true; nb.disabled = true;
      try{ await db.collection("personnes").doc(k).set(p); persons.set(k,p); await markArrival(k,p); }
      catch(e){ fail(e); nb.disabled=false; }
      busy = false;
    });
  }

  async function markArrival(k, p){
    if(!db){ toast("Enregistrement indisponible."); return; }
    const btn=$("#actBtn"); if(btn) btn.disabled=true;
    const now = new Date();
    try{
      await db.collection("passages").add({ plaque:fmtPlate(k), cle:k, nom:p.nom||"", prenom:p.prenom||"", societe:p.societe||"", arrivee:now.toISOString(), depart:null, jour:dayOf(now) });
      toast(`Arrivée ${hm(now.toISOString())} · ${fullName(p)}`);
      plateInput.value=""; renderResult(); plateInput.focus();
    }catch(e){ fail(e); if(btn) btn.disabled=false; }
  }
  async function markDeparture(pass){
    if(!db){ toast("Enregistrement indisponible."); return; }
    const now = new Date().toISOString();
    try{
      await db.collection("passages").doc(pass.id).update({ depart: now });
      toast(`Départ ${hm(now)} · ${fullName(pass)}`);
      if(key(plateInput.value)===pass.cle){ plateInput.value=""; renderResult(); }
    }catch(e){ fail(e); }
  }

  function fiche(r, departHtml){
    return `<div class="fiche">
      <div class="temps"><span class="label">Arrivée</span><span class="heure">${hm(r.arrivee)}</span><span class="label">Départ</span>${departHtml}</div>
      <div class="infos"><span class="pl">${esc(r.plaque)}</span><div class="ligne"><span class="label">Nom &amp; Prénom</span><b>${esc(fullName(r))}</b></div><div class="ligne"><span class="label">Société</span><b>${esc(r.societe||"—")}</b></div></div>
    </div>`;
  }
  function renderOnsite(){
    const arr = [...onsite.values()].sort((a,b)=> a.arrivee < b.arrivee ? 1 : -1);
    $("#onsiteCount").textContent = arr.length;
    const el = $("#onsiteList");
    if(!arr.length){ el.innerHTML = `<div class="empty">Personne sur site</div>`; return; }
    el.innerHTML = arr.map(p => fiche(p, `<button class="btn small depart" data-id="${esc(p.id)}">Valider</button>`)).join("");
    el.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => {
      const p = arr.find(x=>x.id===b.dataset.id); b.disabled = true; markDeparture(p);
    }));
  }

  // ---------- HISTORIQUE ----------
  const histDate = $("#histDate");
  histDate.value = dayOf(new Date());
  histDate.addEventListener("change", loadHistory);
  $("#histSearch").addEventListener("input", renderHistory);
  let histRows = [], histLoading = false;

  async function loadHistory(){
    if(!db){ histRows = []; renderHistory(); return; }
    histLoading = true; renderHistory();
    try{
      const snap = await db.collection("passages").where("jour","==",histDate.value).get();
      histRows = snap.docs.map(d => ({id:d.id, ...d.data()}));
    }catch(e){ histRows = []; }
    histLoading = false; renderHistory();
  }
  function filteredHist(){
    const q = $("#histSearch").value.trim().toLowerCase(), qk = key(q);
    return histRows.filter(r => !q || [r.nom,r.prenom,r.societe].join(" ").toLowerCase().includes(q) || (qk && (r.cle||"").includes(qk)))
      .sort((a,b)=> a.arrivee < b.arrivee ? -1 : 1);
  }
  function renderHistory(){
    const body = $("#histBody");
    if(histLoading){ body.innerHTML = `<div class="empty">Chargement…</div>`; return; }
    const rows = filteredHist();
    const present = histRows.filter(r=>!r.depart).length;
    $("#histStats").innerHTML = `<span><b>${histRows.length}</b> passage${histRows.length>1?"s":""}</span><span><b>${new Set(histRows.map(r=>r.societe).filter(Boolean)).size}</b> société(s)</span><span><b>${present}</b> encore sur site</span>`;
    $("#exportBtn").hidden = !downloads || !histRows.length;
    if(!rows.length){ body.innerHTML = `<div class="empty">${histRows.length ? "Aucun résultat" : "Aucun passage"}</div>`; return; }
    body.innerHTML = rows.map(r => fiche(r, r.depart ? `<span class="heure dep">${hm(r.depart)}</span><span class="duree">${dur(r.arrivee,r.depart)}</span>` : `<span class="pill in">Sur site</span>`)).join("");
  }
  $("#exportBtn").addEventListener("click", async () => {
    const q = v => '"'+String(v??"").replace(/"/g,'""')+'"';
    const lines = [["Date","Arrivée","Départ","Plaque","Nom","Prénom","Société"].join(";")]
      .concat(filteredHist().map(r => [histDate.value, hm(r.arrivee), hm(r.depart), r.plaque, r.nom, r.prenom, r.societe].map(q).join(";")));
    try{ await downloads.save({ filename:`filtrage-${histDate.value}.csv`, data:"﻿"+lines.join("\r\n") }); }
    catch(e){ if(e && e.code!=="cancelled") toast("Export impossible."); }
  });

  // ---------- PERSONNES ----------
  $("#persSearch").addEventListener("input", renderPersons);
  function renderPersons(){
    const q = $("#persSearch").value.trim().toLowerCase(), qk = key(q);
    const all = [...persons.entries()].sort((a,b)=> (a[1].nom||"").localeCompare(b[1].nom||""));
    $("#persCount").textContent = all.length + " enregistrée" + (all.length>1?"s":"");
    const list = all.filter(([k,p]) => !q || [p.nom,p.prenom,p.societe].join(" ").toLowerCase().includes(q) || (qk && k.includes(qk)));
    const el = $("#persList");
    if(!all.length){ el.innerHTML = `<div class="empty">Aucune personne</div>`; return; }
    if(!list.length){ el.innerHTML = `<div class="empty">Aucun résultat.</div>`; return; }
    el.innerHTML = list.map(([k,p]) => `<div class="item">
      <span class="pl">${esc(fmtPlate(k))}</span>
      <div class="m"><div><b>${esc(fullName(p))}</b></div><div class="sub">${esc(p.societe||"—")}</div></div>
      ${pendingDelete===k ? `<span class="confirm"><button class="btn small danger" data-del="${esc(k)}">Supprimer</button><button class="btn small" data-cancel="1">Annuler</button></span>`
        : `<button class="btn small" data-ask="${esc(k)}">Retirer</button>`}</div>`).join("");
    el.querySelectorAll("[data-ask]").forEach(b => b.addEventListener("click", () => { pendingDelete=b.dataset.ask; renderPersons(); }));
    el.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => { pendingDelete=null; renderPersons(); }));
    el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      try{ await db.collection("personnes").doc(b.dataset.del).delete(); toast("Personne retirée."); }catch(e){ fail(e); }
      pendingDelete=null;
    }));
  }
  $("#importBtn").addEventListener("click", async () => {
    if(!db){ toast("Enregistrement indisponible."); return; }
    const lines = $("#importText").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let ok=0, bad=0;
    const btn=$("#importBtn"); btn.disabled=true;
    for(const l of lines){
      const parts = l.split(/[;\t,]/).map(s=>s.trim());
      const k = key(parts[0]);
      if(!k || k.length<4 || !parts[1] || /^plaque$/i.test(parts[0])){ bad++; continue; }
      const p = { plaque:fmtPlate(k), nom:parts[1].toUpperCase(), prenom:parts[2]||"", societe:parts[3]||"", cree:new Date().toISOString() };
      try{ await db.collection("personnes").doc(k).set(p); ok++; }catch(e){ bad++; if(e && e.code==="quota_exceeded") break; }
    }
    btn.disabled=false;
    toast(`${ok} personne(s) importée(s)` + (bad? ` · ${bad} ligne(s) ignorée(s)` : ""));
    if(ok) $("#importText").value="";
  });

  // ---------- DONNÉES ----------
  function rebuildOnsite(){
    onsite = new Map();
    // plus récent d'abord : on garde le dernier passage ouvert par plaque
    for(const p of recent){ if(!p.depart && !onsite.has(p.cle)) onsite.set(p.cle, p); }
    renderOnsite();
    if(!busy) renderResult();
  }

  renderResult();
  try{ const t=localStorage.getItem("tab"); if(t && t!=="filtrage") showTab(t); }catch(e){}

  (async () => {
    if(!window.claude || !claude.use){ $("#offline").hidden=false; $("#onsiteList").innerHTML='<div class="empty">—</div>'; $("#persList").innerHTML='<div class="empty">—</div>'; renderHistory(); return; }
    db = await claude.use("db");
    downloads = await claude.use("downloads");
    if(!db){ $("#offline").hidden=false; $("#onsiteList").innerHTML='<div class="empty">—</div>'; $("#persList").innerHTML='<div class="empty">—</div>'; renderHistory(); return; }
    db.collection("personnes").onSnapshot(snap => {
      persons = new Map(snap.docs.map(d => [d.id, d.data()]));
      renderPersons(); if(!busy) renderResult();
    }, () => {});
    db.collection("passages").orderBy("arrivee","desc").limit(600).onSnapshot(snap => {
      recent = snap.docs.map(d => ({id:d.id, ...d.data()}));
      rebuildOnsite();
      if(!$("#p-historique").hidden && !histLoading){
        // rafraîchir l'historique du jour affiché
        const day = histDate.value;
        if(recent.some(r=>r.jour===day) || histRows.length) {
          const fromRecent = recent.filter(r=>r.jour===day);
          if(fromRecent.length >= histRows.length){ histRows = fromRecent; renderHistory(); }
        }
      }
    }, () => {});
    if(!$("#p-historique").hidden) loadHistory();
  })();
})();
</script>
</body></html>
